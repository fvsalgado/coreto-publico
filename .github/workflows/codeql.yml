name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda-feira de madrugada. Uma análise semanal apanha as vulnerabilidades
    # que passaram a ser conhecidas depois de o código ter sido escrito — que
    # são a maioria delas.
    - cron: '40 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analise:
    name: Análise (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Só corre onde o «code scanning» pode estar ligado.
    #
    # Num repositório privado sem GitHub Advanced Security, o CodeQL não tem
    # onde entregar os resultados e a análise termina em erro de configuração
    # — um vermelho permanente que não diz nada sobre o código e que, ao fim de
    # uma semana, se aprende a ignorar. Aprender a ignorar um sinal de
    # segurança é pior do que não ter o sinal.
    #
    # Assim o trabalho é saltado enquanto o repositório for privado, e começa a
    # correr sozinho no dia em que passar a público — que é o destino deste,
    # publicado sob AGPL-3.0.
    #
    # Aqui esteve escrito `|| github.event_name == 'schedule'`, e era a exceção
    # a desfazer a regra: a execução agendada passava a condição, corria, e
    # falhava pela razão que a condição existe para evitar. Verificado nas duas
    # execuções agendadas que houve — 2026-08-31 e 2026-09-07, as duas
    # segundas-feiras, as duas vermelhas. Um alarme semanal que toca sempre por
    # uma razão que não é a sua é o alarme que se aprende a ignorar, que é
    # exatamente o que este comentário dizia para não fazer.
    if: github.event.repository.visibility == 'public'

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # `actions` analisa os próprios workflows. Vale a pena: um workflow com
        # permissões a mais ou a interpolar entrada de fora num script é uma
        # porta tão aberta como qualquer outra.
        linguagem: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.linguagem }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:${{ matrix.linguagem }}'
