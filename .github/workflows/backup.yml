name: Cópia de segurança

on:
  schedule:
    # 02:40 UTC — 40 minutos antes da recolha noturna, de propósito.
    #
    # A cópia apanha assim o estado que uma pessoa reviu no dia anterior, e não
    # o que a recolha escreveu por cima de madrugada. Se uma noite correr mal, a
    # cópia mais recente é anterior ao estrago.
    #
    # O cron do GitHub é em UTC: isto é 02:40 em Lisboa no inverno e 03:40 no
    # verão. Ver o cabeçalho de `scrape.yml`.
    #
    # SEMANAL desde 17 de setembro de 2026, por decisão do editor — era
    # diária. São ~45 minutos de Actions por mês poupados.
    #
    # O QUE ISSO CUSTA, para ficar dito: a janela de perda passa de um dia a
    # sete. Numa base de dados financeira seria mau negócio; nesta não é tanto,
    # porque quase tudo o que aqui está volta a ser recolhido das fontes pelo
    # `scrape.yml` — o que NÃO volta é o trabalho humano de moderação: o que
    # foi aprovado, recusado, corrigido à mão ou escrito de raiz. É esse o
    # trabalho que uma semana má leva.
    #
    # Ao domingo, para a cópia apanhar a semana fechada.
    - cron: '40 2 * * 0'

  workflow_dispatch:

concurrency:
  group: copia-de-seguranca
  cancel-in-progress: false

permissions:
  contents: read
  # Para abrir ou comentar o aviso de falha.
  issues: write

jobs:
  copiar:
    name: Exportar e guardar fora do fornecedor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # As seis, e não quatro.
      #
      # Este passo verificava só metade: faltavam as duas credenciais do balde,
      # que são usadas três passos à frente. Sem elas o trabalho corria o
      # `pg_dump` inteiro, cifrava, e só rebentava no envio, com um erro da AWS
      # sobre uma credencial vazia — a dois minutos e a três passos de distância
      # da causa. O sítio de dar por falta de uma configuração é antes de se
      # fazer trabalho nenhum.
      - name: Confirmar a configuração
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          # Aqui e não interpolada no script: um `${{ }}` dentro de um bloco de
          # shell é o padrão que abre a porta a injeção, mesmo quando o valor é
          # de confiança. O hábito vale mais do que o caso.
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
        run: |
          em_falta=''
          [ -n "${DATABASE_URL}" ]                 || em_falta="${em_falta} BACKUP_DATABASE_URL"
          [ -n "${BACKUP_PASSPHRASE}" ]            || em_falta="${em_falta} BACKUP_PASSPHRASE"
          [ -n "${BACKUP_S3_ACCESS_KEY_ID}" ]      || em_falta="${em_falta} BACKUP_S3_ACCESS_KEY_ID"
          [ -n "${BACKUP_S3_SECRET_ACCESS_KEY}" ]  || em_falta="${em_falta} BACKUP_S3_SECRET_ACCESS_KEY"
          [ -n "${BACKUP_S3_BUCKET}" ]             || em_falta="${em_falta} BACKUP_S3_BUCKET"
          [ -n "${BACKUP_S3_ENDPOINT}" ]           || em_falta="${em_falta} BACKUP_S3_ENDPOINT"
          if [ -n "${em_falta}" ]; then
            echo "Falta configurar:${em_falta}" >&2
            echo "Uma cópia de segurança que falha em silêncio é pior do que não ter nenhuma." >&2
            echo "Ver docs/BACKUPS.md." >&2
            exit 1
          fi

          # Espaços e mudanças de linha que vieram na cópia.
          #
          # Nenhum destes seis valores pode conter espaço: são um URL, uma
          # frase em base64url, duas chaves hexadecimais, um nome de balde e um
          # endereço. Um salto de linha colado sem querer — porque a string
          # apareceu quebrada no painel de onde se copiou — passa na verificação
          # de «não está vazia» e rebenta três passos à frente, com o `pg_dump`
          # a dizer «unexpected spaces» e a mostrar a string **mascarada**, que
          # é precisamente o que impede de ver onde está o espaço.
          #
          # Aqui diz-se qual das configurações é, que é o que falta saber.
          sujas=''
          verificar_espacos() {
            case "$2" in
              *[[:space:]]*) sujas="${sujas} $1" ;;
            esac
          }
          verificar_espacos BACKUP_DATABASE_URL         "${DATABASE_URL}"
          verificar_espacos BACKUP_PASSPHRASE           "${BACKUP_PASSPHRASE}"
          verificar_espacos BACKUP_S3_ACCESS_KEY_ID     "${BACKUP_S3_ACCESS_KEY_ID}"
          verificar_espacos BACKUP_S3_SECRET_ACCESS_KEY "${BACKUP_S3_SECRET_ACCESS_KEY}"
          verificar_espacos BACKUP_S3_BUCKET            "${BACKUP_S3_BUCKET}"
          verificar_espacos BACKUP_S3_ENDPOINT          "${BACKUP_S3_ENDPOINT}"
          if [ -n "${sujas}" ]; then
            echo "Com espaços ou mudanças de linha:${sujas}" >&2
            echo "Volta a colar cada uma numa linha só, sem espaço antes nem depois." >&2
            echo "Ver docs/BACKUPS.md." >&2
            exit 1
          fi

          # Não é obrigatória — tem omissão — mas a omissão é uma região da AWS,
          # e contra um balde R2 da Cloudflare a assinatura falha. Aviso em vez
          # de falha: quem usar outro fornecedor tem a omissão certa.
          case "${BACKUP_S3_ENDPOINT}" in
            *r2.cloudflarestorage.com*)
              if [ "${BACKUP_S3_REGION}" != 'auto' ]; then
                echo "::warning::O destino é R2 e BACKUP_S3_REGION não é 'auto'; a assinatura vai falhar."
              fi
              ;;
          esac

      # O `pg_dump` corre dentro da imagem oficial do PostgreSQL 17, e não com o
      # cliente do runner, para a versão da ferramenta acompanhar a do servidor.
      # Um `pg_dump` mais antigo do que o servidor recusa-se a correr, e a altura
      # de descobrir isso não é o dia do restauro. O 17 é a versão do projeto
      # Supabase (Project Settings → Infrastructure); quando o servidor subir,
      # sobe-se aqui e em restauro.yml, que restaura com a mesma versão.
      # Só o esquema `public`: é onde estão os dados. Os ficheiros do Supabase
      # Storage (cartazes e PDF anexados às submissões) NÃO vêm aqui — ver a
      # secção «O que isto não cobre» em docs/BACKUPS.md.
      #
      # AQUI ESTEVE UM `--no-privileges`, E TIRÁ-LO É A CORREÇÃO DE UM DEFEITO.
      #
      # Com ele, a cópia levava as tabelas, os dados e as políticas de RLS, e
      # **nem uma concessão**. Uma base restaurada assim está inteira e não
      # serve: o papel `anon` — que é o do sítio — não conta um evento, e a
      # agenda responde vazia a tudo. Uma cópia que não repõe um sistema a
      # funcionar não é uma cópia de segurança.
      #
      # O ensaio de restauro tentou compensar isto no destino, reexecutando as
      # instruções `grant` e `revoke` das migrações. Reprovou seis vezes a 15 de
      # setembro de 2026, e a sexta fechou a questão: a 0102 revoga numa
      # `set_site_section` de quatro argumentos e a 0109 redefiniu-a com cinco.
      # **Não se reconstrói o estado atual de privilégios reexecutando história
      # contra o esquema de hoje** — a história refere-se aos objetos como eles
      # eram. Não havia maneira de compensar no destino; havia de corrigir aqui.
      #
      # O `--no-owner` fica. A cópia é restaurada noutro projeto, onde o dono é
      # quem restaura; o que se quer guardar é quem pode ler o quê, não quem
      # assina. Medido em produção: as 244 concessões do esquema `public` são
      # todas concedidas pelo `postgres` a `postgres`, `anon`, `authenticated`,
      # `service_role` e `PUBLIC` — nenhum papel que o destino não tenha.
      - name: Exportar a base de dados
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          FICHEIRO="coreto-$(date --utc +%Y%m%d).dump"
          echo "FICHEIRO=${FICHEIRO}" >> "${GITHUB_ENV}"
          # `--user` porque a imagem oficial do Postgres não declara nenhum, e
          # um comando avulso corre como root: o ficheiro sairia de root, e o
          # `shred` do passo seguinte — que precisa de escrever para destruir —
          # ficaria com «Permission denied» sobre a própria cópia. Ler bastava
          # ao `gpg`, o que fazia isto falhar só no passo a seguir ao que o
          # causou. O `pg_dump` não precisa de utilizador do sistema: o nome
          # com que se autentica vem no próprio endereço de ligação.
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "${PWD}:/saida" --env DATABASE_URL postgres:17 \
            pg_dump "${DATABASE_URL}" \
              --format=custom \
              --compress=9 \
              --no-owner \
              --schema=public \
              --file="/saida/${FICHEIRO}"
          ls -lh "${FICHEIRO}"

      # Cifrada antes de sair daqui. O destino é um fornecedor diferente do da
      # base de dados — que é a razão de existir desta cópia —, e um dump em
      # claro num balde de terceiros é a fila de submissões inteira, com os
      # endereços de quem submeteu, na mão de quem tiver a chave desse balde.
      - name: Cifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          printf '%s' "${BACKUP_PASSPHRASE}" > frase.txt
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-file frase.txt \
            --output "${FICHEIRO}.gpg" "${FICHEIRO}"
          shred --remove frase.txt "${FICHEIRO}"
          ls -lh "${FICHEIRO}.gpg"

      - name: Enviar para o destino
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'eu-central-1' }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: |
          # As semanais vivem num prefixo com expiração curta; na primeira
          # cópia de cada mês guarda-se também uma no prefixo mensal, que a
          # regra de ciclo de vida do balde mantém um ano. Ver docs/BACKUPS.md.
          #
          # O prefixo chamou-se `diarias/` enquanto a cópia foi diária. Passou a
          # `semanais/` a 19 de setembro de 2026: um nome que diz uma cadência
          # que já não é a sua é a primeira coisa em que um restauro tropeça
          # às três da manhã. O ensaio procura nos dois enquanto houver cópias
          # antigas no primeiro.
          aws s3 cp "${FICHEIRO}.gpg" \
            "s3://${BACKUP_S3_BUCKET}/semanais/${FICHEIRO}.gpg" \
            --endpoint-url "${BACKUP_S3_ENDPOINT}"

          # «Dia 1» deixou de servir quando a cópia passou a semanal: só há
          # cópia ao domingo, e o dia 1 é domingo uma vez em sete meses. A
          # mensal passa a ser a primeira cópia de cada mês — a do primeiro
          # domingo, que é sempre um dos sete primeiros dias.
          if [ "$(date --utc +%d)" -le 7 ]; then
            aws s3 cp "${FICHEIRO}.gpg" \
              "s3://${BACKUP_S3_BUCKET}/mensais/${FICHEIRO}.gpg" \
              --endpoint-url "${BACKUP_S3_ENDPOINT}"
          fi

      # Os anexos, que o `pg_dump` não leva e que ninguém tinha.
      #
      # A cópia sempre levou a base de dados e mais nada. Os cartazes e os PDF
      # que chegam nas submissões vivem no balde `intake` do Storage, e o
      # `docs/BACKUPS.md` dizia, com todas as letras, que isso ficava por
      # sincronizar «à mão de vez em quando» — que é como quem diz nunca. Um
      # evento perdido volta na recolha da noite seguinte; um cartaz que alguém
      # enviou uma vez, não.
      #
      # O Supabase serve o Storage por uma interface compatível com S3, e é por
      # aí que isto passa: `aws s3 sync` contra o balde de origem, e o destino é
      # o mesmo prefixo por cadência das cópias da base. Sem cifra própria — o
      # que vai são ficheiros que já estiveram acessíveis por endereço
      # assinado, e não o dump com a fila de moderação lá dentro.
      #
      # **Salta com aviso sem as credenciais**, como tudo o que aqui precisa de
      # produção: as chaves S3 do Storage são secrets que o dono cria no painel
      # do Supabase (Settings → Storage → S3 access keys), e até lá este passo
      # diz alto que os anexos continuam sem cópia em vez de deixar a cópia
      # parecer completa.
      - name: Sincronizar os anexos
        env:
          AWS_DEFAULT_REGION: ${{ vars.SUPABASE_S3_REGION || 'eu-west-3' }}
          SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          DESTINO_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          DESTINO_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_S3_ACCESS_KEY_ID}" ] || [ -z "${SUPABASE_S3_ENDPOINT}" ]; then
            echo "::warning::Sem credenciais S3 do Storage — os anexos continuam sem cópia. Ver docs/CONFIGURACAO-DO-DONO.md."
            exit 0
          fi

          PASTA="$(mktemp -d)"

          # Duas contas diferentes: a de origem é o Supabase, a de destino é o
          # balde das cópias. Um `sync` direto entre elas exigia um perfil por
          # cada, e o passo intermédio em disco é mais fácil de ler às três da
          # manhã do que uma configuração de perfis do AWS CLI.
          AWS_ACCESS_KEY_ID="${SUPABASE_S3_ACCESS_KEY_ID}" \
          AWS_SECRET_ACCESS_KEY="${SUPABASE_S3_SECRET_ACCESS_KEY}" \
            aws s3 sync "s3://intake" "${PASTA}" \
              --endpoint-url "${SUPABASE_S3_ENDPOINT}" --only-show-errors

          QUANTOS="$(find "${PASTA}" -type f | wc -l)"
          echo "anexos no balde: ${QUANTOS}"

          AWS_ACCESS_KEY_ID="${DESTINO_ACCESS_KEY_ID}" \
          AWS_SECRET_ACCESS_KEY="${DESTINO_SECRET_ACCESS_KEY}" \
            aws s3 sync "${PASTA}" "s3://${BACKUP_S3_BUCKET}/anexos/" \
              --endpoint-url "${BACKUP_S3_ENDPOINT}" --delete --only-show-errors

          rm -rf "${PASTA}"
          echo "✓ ${QUANTOS} anexo(s) sincronizados para anexos/"

      # O que falha aqui falhava calado: nem issue, nem alarme. Uma cópia de
      # segurança que falha em silêncio é uma cópia de segurança que não
      # existe, e só se descobre no dia em que faz falta.
      - name: Avisar que falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITULO: 'A cópia de segurança falhou'
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MANUAL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/BACKUPS.md
        run: |
          {
            echo "A cópia de segurança de $(date --utc --iso-8601=minutes) não terminou."
            echo
            echo "- Execução: ${EXECUCAO}"
            echo
            echo "O que fazer está em [docs/BACKUPS.md](${MANUAL})."
          } > aviso-falha.md

          NUMERO=$(gh issue list --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title == \"${TITULO}\")] | .[0].number // empty")

          if [ -n "${NUMERO}" ]; then
            gh issue comment "${NUMERO}" --body-file aviso-falha.md
          else
            gh issue create --title "${TITULO}" --body-file aviso-falha.md
          fi

          ./scripts/avisar.sh "${TITULO}" high aviso-falha.md

      - name: Apagar o que ficou na máquina
        if: always()
        run: rm --force ./*.dump ./*.gpg frase.txt
