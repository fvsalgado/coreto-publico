name: Publicar

# As migrações antes do deploy, sem mão humana.
#
# Até 19 de setembro de 2026 a Vercel publicava o `main` sozinha e as
# migrações aplicavam-se à mão, depois. A janela entre as duas já custou duas
# publicações a 7 de setembro: o código pedia colunas que a base ainda não
# tinha, o `next build` rebentava a pré-gerar páginas, e o sítio serviu a vaga
# anterior durante mais de uma hora sem um único sinal — a Vercel mantém o
# último build bom, que é o que faz deste modo de falha um dos piores: tudo
# responde e nada é publicado.
#
# A ordem passa a ser esta, e é a que a 0157 já descrevia à mão: o CI passa no
# `main`, este workflow aplica ao projeto de produção as migrações que faltam,
# e só depois pede à Vercel que publique, por um Deploy Hook. Falha uma
# migração, não há deploy — e o sítio fica na versão anterior, inteira e
# coerente com a base.
#
# O QUE FICA DO LADO DO DONO, e sem o qual isto corre em modo degradado:
#
# 1. Criar o Deploy Hook na Vercel (Settings → Git → Deploy Hooks: nome
#    «Publicar», ramo `main`) e guardar o endereço como secret
#    `VERCEL_DEPLOY_HOOK`. Sem ele, este workflow aplica as migrações e diz
#    que não pôde publicar; a Vercel continua a publicar sozinha, e a janela
#    continua a existir.
# 2. Desligar a publicação automática do `main` na Vercel, para que o passo 1
#    passe a ser a única porta: Settings → Git → Ignored Build Step, com o
#    comando `[ "$VERCEL_GIT_COMMIT_REF" != "main" ]` — o build corre para as
#    pré-visualizações e é ignorado no `main`, que passa a vir só pelo hook.
#    (Um deploy pedido pelo hook não passa pelo Ignored Build Step.)
# 3. `BACKUP_DATABASE_URL` já existe nos secrets: é a cadeia de produção que
#    o CI usa para conferir as migrações, e é a que se usa aqui para as
#    aplicar. O nome ficou do dia em que só a cópia a usava.
#
# E UMA TENSÃO QUE FICA ESCRITA, porque ainda não se resolve.
#
# O CI tem um portão — «A base de produção tem o que este código vai pedir» —
# que reprova qualquer PR que traga uma migração que produção ainda não tem. Foi
# escrito para o mundo em que as migrações se aplicavam à mão: sem ele, um PR
# fundia e o deploy rebentava. Neste workflow esse risco deixa de existir, e o
# portão passa a reprovar por uma razão que já não é a sua — o `Publicar` aplica
# a migração antes de qualquer deploy.
#
# **Não se mexeu no portão, e a razão é a ordem das coisas.** Enquanto a Vercel
# continuar a publicar o `main` sozinha (passos 1 e 2 acima por fazer), fundir
# um PR com uma migração nova põe o deploy dela e este workflow a correr ao
# mesmo tempo, e o deploy pode chegar primeiro — exatamente o que custou as
# duas publicações de 7 de setembro. Até o hook existir e o auto-deploy estar
# desligado, o portão é a única proteção e tem de continuar a reprovar; a
# aplicação manual antes de fundir é o que o guião já manda fazer.
#
# Depois disso, o portão pode passar a distinguir dois casos: migrações que o
# próprio PR traz (aviso — o `Publicar` aplica-as) e migrações que já estão no
# `main` e produção não tem (erro — isso quer dizer que este workflow falhou).
# Fica por fazer de propósito, e não por esquecimento.
#
# O passo a passo com capturas está em docs/CONFIGURACAO-DO-DONO.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Duas publicações ao mesmo tempo são duas migrações ao mesmo tempo. Uma de
# cada vez, e a que chega enquanto outra corre espera pela sua vez em vez de
# ser cancelada — cancelar uma migração a meio é pior do que atrasá-la.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Migrar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Só depois de um CI verde no `main`. À mão corre sempre — é o botão de
    # emergência para o dia em que o CI estiver partido por razões que não
    # são do código.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # O commit que o CI aprovou, e não «o main de agora»: entre o CI
          # acabar e isto arrancar pode ter entrado outro push, que terá o
          # seu próprio CI e a sua própria publicação.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Garantir o cliente do PostgreSQL
        run: |
          if command -v psql >/dev/null 2>&1; then
            psql --version
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

      - name: O que falta aplicar
        id: pendentes
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::Sem BACKUP_DATABASE_URL não há como aplicar migrações a produção. Ver docs/CONFIGURACAO-DO-DONO.md."
            exit 1
          fi
          # O guião sai a 0 quando não falta nada, a 2 quando falta, e a 1
          # quando não consegue responder — e esse último tem de parar isto.
          codigo=0
          ./scripts/migracoes-por-aplicar.sh || codigo=$?
          case "${codigo}" in
            0) echo "ha=nao" >> "$GITHUB_OUTPUT" ;;
            2) echo "ha=sim" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Não consegui saber o que falta aplicar (código ${codigo})."; exit 1 ;;
          esac

      - name: Aplicar as migrações a produção
        if: steps.pendentes.outputs.ha == 'sim'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: ./scripts/aplicar-migracoes.sh

      - name: Pedir a publicação à Vercel
        id: hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK}" ]; then
            echo "::warning title=Sem Deploy Hook::As migrações estão aplicadas, mas não há VERCEL_DEPLOY_HOOK nos secrets: a Vercel continua a publicar o main sozinha, e a janela entre as duas continua a existir. Ver docs/CONFIGURACAO-DO-DONO.md."
            echo "pedida=nao" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --silent --show-error --fail --request POST "${VERCEL_DEPLOY_HOOK}" > /dev/null
          echo "pedida=sim" >> "$GITHUB_OUTPUT"
          echo "Publicação pedida à Vercel."

      # A Vercel não nos diz quando acabou sem uma chave de API, e uma chave
      # de API só para saber a hora era mais um segredo. O que se consegue
      # saber daqui é se o sítio responde ao fim de uns minutos — e é o
      # suficiente para o alarme, porque um build que rebenta não substitui o
      # anterior (o sítio responde na mesma, com a versão velha) e um sítio que
      # deixou de responder é a vigilância que o apanha.
      - name: Esperar que o sítio responda
        if: steps.hook.outputs.pedida == 'sim'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://coreto-fvsalgado.vercel.app' }}
        run: |
          sleep 90
          for _ in $(seq 1 20); do
            if curl --silent --fail --output /dev/null "${SITE_URL}/"; then
              echo "O sítio responde em ${SITE_URL}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::O sítio não responde em ${SITE_URL} seis minutos depois de pedir a publicação."
          exit 1

      - name: Avisar que falhou
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "A publicação de $(date --utc --iso-8601=minutes) não terminou."
            echo
            echo "- Execução: ${EXECUCAO}"
            echo
            echo "Se falhou nas migrações, a Vercel não recebeu pedido nenhum e o sítio está na versão anterior. Ver docs/OPERACAO.md."
          } > aviso-falha.md
          ./scripts/avisar.sh 'Coreto — a publicação falhou' urgent aviso-falha.md
