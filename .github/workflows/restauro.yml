name: Ensaio de restauro

# A cópia de segurança corre todas as noites (backup.yml). Uma cópia que nunca
# foi restaurada não é uma cópia de segurança: é uma esperança. Uma vez por
# mês, isto vai buscar a mais recente ao balde, decifra-a, restaura-a num
# Postgres limpo da versão do servidor e faz as três verificações do manual
# (`scripts/ensaiar-restauro.sh`, docs/BACKUPS.md). O resultado — a cópia, o
# peso, o tempo que demorou — fica no resumo da execução.
#
# Precisa dos mesmos segredos da cópia. Sem eles falha no primeiro passo, como
# ela: um ensaio que passa sem ter restaurado nada é pior do que não haver
# ensaio. Nunca toca na base de produção — não recebe a cadeia de ligação dela.
on:
  schedule:
    # Dia 2 de cada mês, de manhã: a diária das 02:40 já está no balde, a
    # mensal do dia 1 também. O atraso da fila do GitHub (ver OPERACAO.md)
    # aplica-se na mesma; é um ensaio, não um relógio.
    - cron: '30 5 2 * *'
  workflow_dispatch:
    inputs:
      copia:
        description: 'A cópia a restaurar, dentro do balde (ex.: mensais/coreto-20260901.dump.gpg). Em branco: a mais recente de diarias/.'
        required: false
        default: ''

permissions:
  contents: read
  # Para abrir ou comentar o aviso de falha.
  issues: write

concurrency:
  group: ensaio-de-restauro
  cancel-in-progress: false

jobs:
  ensaiar:
    name: Restaurar a cópia num Postgres limpo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # A versão maior do servidor de produção: o `pg_restore` só lê o que um
        # `pg_dump` da mesma versão ou mais antiga escreveu, e o que se quer
        # ensaiar é o restauro numa base como a real, não numa mais velha.
        image: postgres:17
        env:
          # Sem palavra-passe, de propósito: a base existe durante o job, só
          # aceita ligações da própria máquina e desaparece no fim (ver o
          # serviço do job Migrações em ci.yml).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Confirmar a configuração
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: |
          em_falta=''
          [ -n "${BACKUP_PASSPHRASE}" ]           || em_falta="${em_falta} BACKUP_PASSPHRASE"
          [ -n "${BACKUP_S3_ACCESS_KEY_ID}" ]     || em_falta="${em_falta} BACKUP_S3_ACCESS_KEY_ID"
          [ -n "${BACKUP_S3_SECRET_ACCESS_KEY}" ] || em_falta="${em_falta} BACKUP_S3_SECRET_ACCESS_KEY"
          [ -n "${BACKUP_S3_BUCKET}" ]            || em_falta="${em_falta} BACKUP_S3_BUCKET"
          [ -n "${BACKUP_S3_ENDPOINT}" ]          || em_falta="${em_falta} BACKUP_S3_ENDPOINT"
          if [ -n "${em_falta}" ]; then
            echo "Falta configurar:${em_falta}" >&2
            echo "Sem a cópia configurada não há nada para ensaiar. Ver docs/BACKUPS.md." >&2
            exit 1
          fi

      # O cliente que o runner traz é o 16; o servidor de produção é o 17, e
      # o `pg_restore` tem de ser, pelo menos, da versão do `pg_dump` que
      # escreveu a cópia. O repositório oficial do PostgreSQL tem o 17.
      - name: Instalar o cliente do PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "${GITHUB_PATH}"

      - name: Restaurar e verificar
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION || 'eu-central-1' }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          COPIA: ${{ inputs.copia }}
        run: |
          pg_restore --version
          ./scripts/ensaiar-restauro.sh

      # O relatório fica no resumo da execução, passe ou falhe: é o registo
      # que o manual pede — data, cópia, resultado, tempo.
      - name: Guardar o relatório
        if: always()
        run: |
          if [ -f relatorio.md ]; then
            cat relatorio.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      # O que falha aqui falhava calado: nem issue, nem alarme. Uma cópia de
      # segurança que falha em silêncio é uma cópia de segurança que não
      # existe, e só se descobre no dia em que faz falta.
      - name: Avisar que falhou
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITULO: 'O ensaio de restauro falhou'
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MANUAL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/BACKUPS.md
        run: |
          {
            echo "O ensaio de restauro de $(date --utc --iso-8601=minutes) não passou."
            echo
            echo "- Execução: ${EXECUCAO}"
            echo
            echo "O que fazer está em [docs/BACKUPS.md](${MANUAL})."
          } > aviso-falha.md

          NUMERO=$(gh issue list --state open --limit 50 --json number,title \
            --jq "[.[] | select(.title == \"${TITULO}\")] | .[0].number // empty")

          if [ -n "${NUMERO}" ]; then
            gh issue comment "${NUMERO}" --body-file aviso-falha.md
          else
            gh issue create --title "${TITULO}" --body-file aviso-falha.md
          fi

          ./scripts/avisar.sh "${TITULO}" high aviso-falha.md

      - name: Apagar o que ficou na máquina
        if: always()
        run: rm --force ./*.dump ./*.gpg frase.txt relatorio.md
