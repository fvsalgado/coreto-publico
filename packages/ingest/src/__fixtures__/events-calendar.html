<!doctype html>
<!--
  Fixture INVENTADA para os testes do leitor events-calendar: uma página de
  agenda com schema.org/Event em JSON-LD, tal como a maioria dos plugins de
  eventos a escreve. Os eventos, os sítios e os endereços não existem; nada
  aqui é conteúdo de terceiros. O que está em prova é o contrato — o
  schema.org — e não a marcação de um sítio.
-->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Agenda — Sociedade Filarmónica da Ponte (inventada)</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "name": "Sociedade Filarmónica da Ponte",
      "url": "https://filarmonica-da-ponte.example/"
    },
    {
      "@type": "Event",
      "name": "Concerto de Outono",
      "description": "A banda apresenta o programa de outono, com <em>solistas</em> convidados.",
      "url": "/agenda/concerto-de-outono/",
      "startDate": "2026-10-17T21:30:00+01:00",
      "endDate": "2026-10-17T23:00:00+01:00",
      "image": "https://filarmonica-da-ponte.example/img/outono.jpg",
      "location": {
        "@type": "Place",
        "name": "Salão da Filarmónica",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Largo da Ponte 3",
          "addressLocality": "Ponte do Bombo",
          "postalCode": "9999-100"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 41.321, "longitude": -7.051 }
      },
      "offers": {
        "@type": "Offer",
        "price": "5",
        "priceCurrency": "EUR",
        "url": "https://filarmonica-da-ponte.example/bilhetes/outono"
      },
      "eventStatus": "https://schema.org/EventScheduled"
    },
    {
      "@type": "TheaterEvent",
      "name": "«O Coreto Vazio», pelo grupo de teatro da Ponte",
      "url": "https://filarmonica-da-ponte.example/agenda/o-coreto-vazio/",
      "startDate": "2026-11-07",
      "endDate": "2026-11-08",
      "location": "Salão da Filarmónica",
      "isAccessibleForFree": true,
      "genre": "Teatro"
    }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicEvent",
  "name": "Recital cancelado",
  "url": "https://filarmonica-da-ponte.example/agenda/recital-cancelado/",
  "startDate": "2026-10-24T18:00:00+01:00",
  "eventStatus": "https://schema.org/EventCancelled",
  "location": { "@type": "Place", "name": "Salão da Filarmónica" }
}
</script>
</head>
<body>
<main>
  <h1>Agenda</h1>
  <article class="evento">
    <h2><a href="/agenda/concerto-de-outono/">Concerto de Outono</a></h2>
    <p class="data">17 de outubro de 2026, 21h30</p>
  </article>
  <article class="evento">
    <h2><a href="/agenda/o-coreto-vazio/">«O Coreto Vazio»</a></h2>
    <p class="data">7 e 8 de novembro de 2026</p>
    <!-- O tema escreve o cartão outra vez em JSON-LD: é o mesmo evento. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TheaterEvent",
      "name": "«O Coreto Vazio», pelo grupo de teatro da Ponte",
      "url": "https://filarmonica-da-ponte.example/agenda/o-coreto-vazio/",
      "startDate": "2026-11-07",
      "endDate": "2026-11-08",
      "location": "Salão da Filarmónica"
    }
    </script>
  </article>
</main>
</body>
</html>
